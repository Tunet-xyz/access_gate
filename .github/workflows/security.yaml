name: Security

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  security:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Static security analysis
        run: bandit -r src/access_gate
      - name: Exclude local package from third-party dependency audit
        run: pip uninstall --yes AccessGate


      - name: Dependency vulnerability audit
        run: pip-audit --strict
