name: Security

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  security:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Static security analysis
        run: bandit -r src/access_gate
      - name: Exclude local package from third-party dependency audit
        run: pip uninstall --yes AccessGate


      - name: Dependency vulnerability audit
        run: pip-audit --strict
