name: CodeQL security analysis
on:
  workflow_dispatch:

permissions: {contents: read}
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1'
    runs-on: ubuntu-latest
    permissions: {actions: read, contents: read, security-events: write, packages: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with: {languages: python, queries: security-extended}
      - uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
