name: Fuzz testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && github.triggering_actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target:
          - "fuzz/fuzz_policy_json.py fuzz/corpus/policy"
          - "fuzz/fuzz_mcp_json.py fuzz/corpus/mcp"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install fuzz dependencies
        run: python -m pip install ".[fuzz]"
      - name: Fuzz parser for 120 seconds
        run: python ${{ matrix.target }} -max_total_time=120 -rss_limit_mb=2048
