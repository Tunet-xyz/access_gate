name: Fuzz testing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target:
          - "fuzz/fuzz_policy_json.py fuzz/corpus/policy"
          - "fuzz/fuzz_mcp_json.py fuzz/corpus/mcp"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install fuzz dependencies
        run: python -m pip install ".[fuzz]"
      - name: Fuzz parser for 120 seconds
        run: python ${{ matrix.target }} -max_total_time=120 -rss_limit_mb=2048
