name: Fuzz testing

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        target:
          - "fuzz/fuzz_policy_json.py fuzz/corpus/policy"
          - "fuzz/fuzz_mcp_json.py fuzz/corpus/mcp"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install fuzz dependencies
        run: python -m pip install ".[fuzz]"
      - name: Fuzz parser for 120 seconds
        run: python ${{ matrix.target }} -max_total_time=120 -rss_limit_mb=2048
