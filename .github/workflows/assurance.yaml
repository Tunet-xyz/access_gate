name: Security assurance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assurance:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install assurance dependencies
        run: python -m pip install ".[dev,assurance]"
      - name: Run property and integrity suites
        run: >-
          pytest tests/test_properties.py tests/test_integrity.py
          tests/test_release_tools.py tests/test_authorization_benchmark.py
      - name: Enforce authorization performance budgets
        run: python -m tools.authorization_benchmark --enforce
      - name: Verify reproducible distributions
        run: python -m tools.verify_reproducible_build

  mutation:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'bezu-1' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install mutation dependencies
        run: python -m pip install ".[dev,assurance]"
      - name: Run mutation tests
        run: mutmut run
      - name: Reject surviving or untested mutants
        run: python -m tools.check_mutation_results
