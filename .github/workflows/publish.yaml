name: Publish to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install --require-hashes -r requirements/build.txt

      - name: Set reproducible build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Verify reproducible build
        run: python -m tools.verify_reproducible_build

      - name: Build package
        run: python -m build --no-isolation --outdir dist/packages

      - name: Normalize source distribution
        run: python -m tools.normalize_sdist dist/packages/*.tar.gz

      - name: Validate package metadata
        run: python -m twine check dist/packages/*

      - name: Generate SPDX SBOM
        run: >-
          python -m tools.generate_sbom
          --dist dist/packages
          --output dist/evidence/accessgate.spdx.json

      - name: Validate SPDX SBOM
        run: pyspdxtools -i dist/evidence/accessgate.spdx.json

      - name: Generate artifact checksums
        run: >-
          sha256sum dist/packages/* dist/evidence/accessgate.spdx.json |
          sed 's#dist/packages/##; s#dist/evidence/##' > dist/evidence/SHA256SUMS

      - name: Upload verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  release-assets:
    name: Retain release evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist/

      - name: Attach artifacts and evidence to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          dist/packages/* dist/evidence/*

  pypi-publish:
    name: Upload release to PyPI
    needs: [build, release-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/AccessGate
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-distributions
          path: dist/

      - name: Publish distribution
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/packages
          print-hash: true
