[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["access_gate*"]

[tool.setuptools.package-data]
access_gate = ["py.typed", "mcp/*.json", "schema/*.json"]

[project]
name = "AccessGate"
version = "1.0.0"
description = "Composable, default-deny RBAC, ABAC, and relationship-aware authorization for Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["authorization", "access-control", "rbac", "abac", "security", "policy"]
authors = [
  { name = "Tunet Ltd", email = "alex@tunet.xyz" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
django = ["Django>=4.2,<7"]
dev = [
  "Django>=4.2,<7",
  "bandit>=1.7",
  "build>=1.2",
  "django-stubs>=4.2",
  "hypothesis>=6.112,<7",
  "mypy>=1.10",
  "pip-audit>=2.7",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "setuptools>=77",
  "tomli>=2; python_version < '3.11'",
  "wheel",
]
assurance = [
  "hypothesis>=6.112,<7",
  "mutmut==3.7.0",
  "pytest>=8.0",
]
fuzz = ["atheris==3.0.0"]

[project.urls]
Homepage = "https://github.com/Tunet-xyz/access_gate"
Documentation = "https://github.com/Tunet-xyz/access_gate/blob/main/docs/README.md"
Repository = "https://github.com/Tunet-xyz/access_gate"
Issues = "https://github.com/Tunet-xyz/access_gate/issues"
Changelog = "https://github.com/Tunet-xyz/access_gate/blob/main/CHANGELOG.md"

[project.scripts]
accessgate-mcp = "access_gate.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["access_gate"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["access_gate"]
mypy_path = "src"

[tool.coverage.run]
source = ["access_gate"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.mutmut]
source_paths = ["src/access_gate/"]
pytest_add_cli_args_test_selection = ["tests/"]
mutate_only_covered_lines = true
# The suite imports tools/ and fuzz/ and reads mcp/agent-contract.json.
also_copy = ["tools/", "fuzz/", "mcp/"]
